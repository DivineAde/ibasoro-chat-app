<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ìbáṣọ̀rọ̀</title>
    <meta name="description" content="ìbáṣọ̀rọ̀ — fast, private, real-time conversations." />
    <meta name="theme-color" content="#f7f5f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Resolve the theme before first paint so there is never a light flash in dark mode. -->
    <script>
      (function () {
        try {
          var pref = JSON.parse(localStorage.getItem("ibasoro:theme")) || "system";
          var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0e0e12" : "#f7f5f1");
        } catch (e) {}
      })();
    </script>

    <!-- Manrope covers the Latin Extended + Vietnamese ranges, i.e. ẹ ọ ṣ and tone marks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>ìbáṣọ̀rọ̀ needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
